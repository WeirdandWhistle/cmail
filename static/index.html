<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <style>
            body{
                width: 99vw;
                height: 98vh;
                display: grid;
                grid-template-columns: 1fr 4fr;
                grid-template-rows: 1fr 20fr;
                gap: 1rem;

                grid-template-areas:
                 "header header"
                 "sidebar main";
            }
            header{
                border: 1px red solid;
                grid-area: header;
                display: flex;
                justify-content: flex-end;
                flex-direction: row;
            }
            sidebar{
                grid-area: sidebar;
                border: 1px black solid;
                height: 100%;
                width: 100%;
                display: flex;
                flex-direction: column;
                padding: 0.2rem;
                gap: 0.2rem;
            }
            panel{
                grid-area: main;
                border: 1px black solid;
                padding: 0.2rem;
                width: 100%;
                height: 100%;
                display: flex;
                overflow: scroll;
                flex-direction: column;
            }
            message{
                display: block;
                position: relative;
                border: 1px black solid;
                width: 95%;
                padding: 0.2rem;
            }
            message username{
                font-weight: bold;
            }
            message date{
                color: grey;
                font-size: 0.8rem;
            }
            message text{
                display: block;
            }
            .messageTab{
                position: relative;
                border: 1px black solid;
                height: 2rem;
                display: flex;
                align-items: center;
                flex-direction: row;
                gap: 3px;
                cursor: pointer;
            }
            .messageTab:hover{
                background-color: #00000010;
            }
</style>
    </head>

    <body>
        
        <header>
            <a href="login">Log in/Sign Up</a>
        </header>


        <sidebar>
            <div class="messageTab">
                <span>testBilly</span><span>&#x2015;</span><span>no unread</span>
            </div>
            <div class="messageTab">
                <span>alf</span><span>&#x2015;</span><span>shes just a girl i use to know!</span>
            </div>
        </sidebar>
        <panel id="panel">
            <h3>This is the start of your messaeg chat with ${Insert Person Here}</h1>
            <div style="height: 0.5rem;">
            <message>
                <username title="@whynotjava">Whynotjava</username>
                <date>25/10/2</date>
                <text>Howdy partner!</text>
            </message>
        </panel>
        
        
        <div style="position: fixed; bottom: 0; right: 5px; padding: 5px; border: 1px red none; width: 500px; gap:10px;" id="alerts"></div>
    </body>

    
  <script type="module" src="app.js"></script>
  <script src="/js/sodium.js" async></script>
</html>
